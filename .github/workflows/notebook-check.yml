name: Notebook structure

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate notebook JSON and Python cells
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          path = Path("MicCheck_AMI.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          assert notebook.get("nbformat") == 4, "Expected notebook format 4"

          for index, cell in enumerate(notebook.get("cells", [])):
              if cell.get("cell_type") != "code":
                  continue
              source = "".join(cell.get("source", []))
              # IPython magics are valid notebook syntax but not Python AST.
              python_source = "\n".join(
                  line for line in source.splitlines()
                  if not line.lstrip().startswith(("%", "!"))
              )
              ast.parse(python_source, filename=f"{path}:cell-{index}")

          print(f"Validated {path}")
          PY
